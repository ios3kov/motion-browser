name: Motion Browser checks

on:
  push:
    paths:
      - "spikes/tech-001/**"
      - "packages/protocol/**"
      - "apps/helper/**"
      - ".github/workflows/tech-001.yml"
  pull_request:
    paths:
      - "spikes/tech-001/**"
      - "packages/protocol/**"
      - "apps/helper/**"
      - ".github/workflows/tech-001.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: TECH-001 protocol tests
        run: node --test spikes/tech-001/tests/*.test.mjs
      - name: Browser helper core and security tests
        run: node --test apps/helper/tests/*.test.mjs
